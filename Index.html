    <h1>Boba</h1>
    <p>What is it?</p>
    <p>Boba, also known as bubble tea, is a popular Taiwanese tea-based drink invented in the 1980s. It typically combines freshly brewed tea, milk, and sweeteners, shaken with ice to create a frothy layer of bubbles on top.</p>
